version: 1
# Software Collection supplies the dependency definitions. These entries keep
# ZDE-specific behavior and paths that existing installations depend on.
dependencies:
  - id: zoul0813/zeal-archiver
    path: home/zeal-archiver
    env:
      - name: ZAR_PATH
        add_to_path:
          - .

  - id: Zeal8bit/Zeal-8-bit-OS
    tag: true
    build: false
    required: true
    migrate: true
    env:
      - name: ZOS_PATH
        add_to_path:
          - tools

  - id: Zeal8bit/Zeal-VideoBoard-SDK
    path: home/Zeal-VideoBoard-SDK
    build: false
    migrate: true
    env:
      - name: ZVB_SDK_PATH
        add_to_path:
          - tools/zeal2gif
          - tools/tiled2zeal
    metadata:
      category: [core]

  - id: zoul0813/zeal-game-dev-kit
    path: home/zeal-game-dev-kit
    build: false
    migrate: true
    env:
      - ZGDK_PATH
    metadata:
      category: [core]

  - id: Zeal8bit/ZealFS
    path: home/ZealFS
    build:
      tool: cmake
      stage: false
    metadata:
      category: [core]

  - id: Zeal8bit/Zeal-Disk-Tool
    path: home/Zeal-Disk-Tool
    build:
      tool: make
      args:
        - cli
      stage: false
    env:
      - name: ZDT_PATH
        add_to_path:
          - build/cli
    metadata:
      category: [core]

  - id: Zeal8bit/Zeal-NativeEmulator
    build:
      commands:
        - meson setup --reconfigure build-headless -Dfrontend=headless --buildtype=release
        - meson compile -C build-headless zeal-headless
      stage: false
    env:
      - name: ZEAL_NATIVE_PATH
        add_to_path:
          - build-headless

  - id: Zeal8bit/Zeal-WebEmulator
    path: home/Zeal-WebEmulator

  - id: Zeal8bit/Zeal-Playground
    path: home/Zeal-Playground

  - id: zoul0813/zeal-coreutils
    path: home/zeal-coreutils
    migrate: true
    env:
      - COREUTILS_PATH
    build:
      tool: cmake
      args:
        - --target
        - bins
      artifacts:
        - bin/
      root: /bin
    metadata:
      category: [core]
